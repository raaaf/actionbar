name: ActionBar

options:
  deploymentTarget:
    macOS: "26.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.3

targets:
  ActionBar:
    type: application
    platform: macOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rafaelalex.ActionBar
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ActionBar.entitlements
        PRODUCT_NAME: ActionBar
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 9LA5969PJ2
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info.plist
      properties:
        LSUIElement: true

  ActionBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ActionBar
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rafaelalex.ActionBarTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9LA5969PJ2

schemes:
  ActionBar:
    build:
      targets:
        ActionBar: all
    test:
      targets:
        - ActionBarTests
